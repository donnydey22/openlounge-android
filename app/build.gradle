plugins {
    id 'com.android.application'
    // FCM: reads app/google-services.json (Firebase project open-lounge-2aabd)
    id 'com.google.gms.google-services'
    // 0.3.16 native call media (NativeCallMedia.kt / NativeLiveKit.kt)
    id 'org.jetbrains.kotlin.android'
}

// Release signing — two sources, first match wins:
//   1) Environment (CI / the new upload key):  OPENLOUNGE_RELEASE_STORE_FILE, OPENLOUNGE_RELEASE_STORE_PASSWORD,
//      OPENLOUNGE_RELEASE_KEY_ALIAS, OPENLOUNGE_RELEASE_KEY_PASSWORD  (e.g. `set -a; . ~/.secrets/openlounge-release.env`).
//      This is the RSA-4096 release key (~/.secrets/openlounge-release.jks). NOTE: an APK signed with it will NOT install
//      over builds signed with the old key — switch only for a fresh distribution (Play / new package install).
//   2) android/keystore.properties (never committed) → storeFile/storePassword/keyAlias/keyPassword. It points at the
//      key that signed every APK Donny has installed (0.2.1 and earlier), so updates install in place and keep data.
// Neither present → release builds are unsigned (assembleRelease still works; the APK just can't be installed).
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def envSigning = ['OPENLOUNGE_RELEASE_STORE_FILE', 'OPENLOUNGE_RELEASE_STORE_PASSWORD', 'OPENLOUNGE_RELEASE_KEY_ALIAS', 'OPENLOUNGE_RELEASE_KEY_PASSWORD']
        .every { System.getenv(it) }
def hasSigning = envSigning || keystorePropsFile.exists()

android {
    namespace 'com.donnydey.openlounge'
    compileSdk 36

    defaultConfig {
        applicationId "com.donnydey.openlounge"
        minSdk 24
        targetSdk 36
        versionCode 33
        versionName "0.3.17"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "boolean", "STAGING", "false"
        buildConfigField "String", "STAGING_HOST", "\"\""
    }

    // prod = the store/website app (openlounge.app). staging = test builds pointed at the native-media staging
    // service (default URL + trusted origin); never shipped as the production APK.
    flavorDimensions "env"
    productFlavors {
        prod { dimension "env" }
        staging {
            dimension "env"
            versionNameSuffix "-staging"
            buildConfigField "boolean", "STAGING", "true"
            buildConfigField "String", "STAGING_HOST", "\"openlounge-staging-native-media-staging.up.railway.app\""
            ndk { abiFilters "arm64-v8a", "armeabi-v7a" } // keeps the test APK under hosting size limits
        }
    }

    signingConfigs {
        release {
            if (envSigning) {
                storeFile file(System.getenv('OPENLOUNGE_RELEASE_STORE_FILE'))
                storePassword System.getenv('OPENLOUNGE_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('OPENLOUNGE_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('OPENLOUNGE_RELEASE_KEY_PASSWORD')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            } else if (keystorePropsFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            minifyEnabled false
            // no applicationIdSuffix: the sideloaded debug APK installs as com.donnydey.openlounge
        }
        release {
            minifyEnabled false
            debuggable false
            if (hasSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    // Play Integrity app verification for phone auth (pulled by firebase-auth; pinned for clarity)
    implementation 'com.google.android.play:integrity:1.4.0'
    implementation 'androidx.browser:browser:1.8.0'
    // numeric launcher badges (Samsung One UI, etc.) — AppBadge
    implementation 'me.leolin:ShortcutBadger:1.1.22@aar'
    // opt-in biometric app lock (BiometricLock)
    implementation 'androidx.biometric:biometric:1.1.0'

    // 0.3.16 native call media: the app owns mic + mediasoup transports (libmediasoupclient + its org.webrtc build);
    // the emergency LiveKit path uses LiveKit's own prefixed WebRTC (livekit.org.webrtc), so the two never clash.
    implementation 'io.github.crow-misia.libmediasoup-android:libmediasoup-android:0.21.0'
    implementation 'io.github.crow-misia.libwebrtc:libwebrtc-ktx:1.12.0' // LogHandler / initializePeerConnectionFactory (runtime-scoped in the mediasoup POM)
    implementation 'io.livekit:livekit-android:2.29.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303' // JVM org.json for MsJsonTest (android.jar's org.json is a stub in unit tests); test-only, not in the APK
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
