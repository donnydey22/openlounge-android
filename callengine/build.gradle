// Standalone native call engine (Donny t4462u): PJSIP + SRTP + jitter buffer + sound device + teardown.
// Owns all call audio; the app / WebView only renders UI and sends UI intents (mute/end) to it.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.donnydey.openlounge.callengine'
    compileSdk 36
    ndkVersion '27.2.12479018'
    defaultConfig {
        minSdk 24
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    buildFeatures { prefab true }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    // pjproject 2.17 prefab AAR (built by .github/workflows/android-prefab.yml), linked + packaged via this module
    implementation files('../app/libs/pjproject-2.17-prefab.aar')
}
