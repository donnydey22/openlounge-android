// Standalone native call engine: one BSD libwebrtc PeerConnection per call (RingRTC session model, OLX3DH-v1 sealed
// rc:* signaling), audio + camera video. The app / WebView only renders UI and sends UI intents to it. No PJSIP.
plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.donnydey.openlounge.callengine'
    compileSdk 36
    ndkVersion '28.2.13676358' // libwebrtc M152 arm64 needs lld>=19 (reloc 315)
    defaultConfig {
        minSdk 24
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    // -PolWebrtcDir=/workspace/webrtc-bsd/m152 (BSD libwebrtc; never RingRTC AGPL binaries)
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    // BSD libwebrtc AAR (org.webrtc Java API + its own libjingle_peerconnection_so.so). The C++ API in libwebrtc.a is
    // built against Chromium libc++ (std::__Cr) and cannot be called from NDK libc++ code, so OL uses the Java API.
    api files("${project.findProperty('olWebrtcDir') ?: '/workspace/webrtc-bsd/m152'}/aar/libwebrtc.aar")
    // OLX3DH-v1 call session crypto (X25519/Ed25519/HKDF on API 26+). MIT licence — not libsignal.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.79'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0' // native WS signaling (CallSignalClient)
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'junit:junit:4.13.2'
}
