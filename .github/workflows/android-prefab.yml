name: pjsip-android
on: { push: { branches: [pjsip-rebuild] }, workflow_dispatch: {} }
env: { NDK_VER: "27.2.12479018" }
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VER" >/dev/null
      - run: |
          git clone -q --depth 1 -b 2.17 https://github.com/pjsip/pjproject.git
          git clone -q --depth 1 -b v1.5.2 https://github.com/xiph/opus.git
      - name: libopus per ABI
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cmake -S opus -B ob-$abi -DCMAKE_TOOLCHAIN_FILE=$ANDROID_HOME/ndk/$NDK_VER/build/cmake/android.toolchain.cmake -DANDROID_ABI=$abi -DANDROID_PLATFORM=24 -DCMAKE_INSTALL_PREFIX=$PWD/opus-$abi -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON >/dev/null
            cmake --build ob-$abi --target install -j4 >/dev/null; done
      - name: build per ABI (pjproject configure-android, reference Application.mk ABIs)
        working-directory: pjproject
        run: |
          export ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/$NDK_VER
          printf '#define PJ_CONFIG_ANDROID 1\n#define PJMEDIA_HAS_SRTP 1\n#define PJMEDIA_HAS_VIDEO 1\n#define PJMEDIA_HAS_ANDROID_MEDIACODEC 1\n#include <pj/config_site_sample.h>\n' > pjlib/include/pj/config_site.h
          for abi in arm64-v8a armeabi-v7a x86_64; do
            make distclean >/dev/null 2>&1 || true
            APP_PLATFORM=android-24 TARGET_ABI=$abi ./configure-android --use-ndk-cflags --with-opus=$PWD/../opus-$abi >/dev/null
            grep -q 'PJMEDIA_HAS_OPUS_CODEC 1' pjmedia/include/pjmedia-codec/config_auto.h && echo "opus ON ($abi)"
            make dep >/dev/null 2>&1; make -j4 >/dev/null
            TC=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin
            case $abi in arm64-v8a) T=aarch64-linux-android24;; armeabi-v7a) T=armv7a-linux-androideabi24;; x86_64) T=x86_64-linux-android24;; esac
            mkdir -p ../prefab/modules/pjproject/libs/android.$abi
            $TC/clang++ --target=$T -shared -static-libstdc++ -Wl,-soname,libpjproject.so -o ../prefab/modules/pjproject/libs/android.$abi/libpjproject.so \
              -Wl,--whole-archive $(find . -path ./pjsip-apps -prune -o -name "*.a" -print | grep -v pjsua2 | grep -v libpjsdp) -Wl,--no-whole-archive ../opus-$abi/lib/libopus.a -llog -lOpenSLES -lmediandk -landroid -lcamera2ndk -lEGL -lGLESv2 -lm -Wl,-z,max-page-size=16384
            echo "{\"abi\":\"$abi\",\"api\":24,\"ndk\":27,\"stl\":\"none\"}" > ../prefab/modules/pjproject/libs/android.$abi/abi.json
          done
          mkdir -p ../prefab/modules/pjproject/include; for d in pjlib pjlib-util pjnath pjmedia pjsip; do cp -R $d/include/* ../prefab/modules/pjproject/include/; done
          cp pjsip-apps/src/samples/android_sample/jni/Application.mk pjsip-apps/src/samples/android_sample/jni/Android.mk ../prefab/
      - name: package prefab AAR
        run: |
          echo '{"schema_version":2,"name":"pjproject","version":"2.17.0","dependencies":[]}' > prefab/prefab.json
          echo '{"export_libraries":[]}' > prefab/modules/pjproject/module.json
          mkdir aar && mv prefab aar/ && cd aar
          printf '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="app.openlounge.pjproject"><uses-sdk android:minSdkVersion="24"/></manifest>' > AndroidManifest.xml
          echo "" > R.txt; mkdir -p tmp && (cd tmp && jar cf ../classes.jar .) && rm -r tmp
          zip -qr ../pjproject-2.17-prefab.aar . && cd .. && unzip -l pjproject-2.17-prefab.aar | tail -15
      - uses: actions/upload-artifact@v4
        with: { name: pjproject-2.17-prefab-aar, path: pjproject-2.17-prefab.aar }
  app:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VER" "cmake;3.22.1" >/dev/null
      - uses: actions/download-artifact@v4
        with: { name: pjproject-2.17-prefab-aar, path: app/libs }
      - name: guard — no WebRTC in app
        run: "! grep -rniE 'org.webrtc|stream-webrtc|livekit|mediasoup' app/build.gradle settings.gradle app/src/main/java"
      - run: chmod +x gradlew && ./gradlew --no-daemon --no-build-cache --rerun-tasks :app:assembleProdDebug :app:assemblePjtestDebug :app:testProdDebugUnitTest 2>&1 | tail -40; test ${PIPESTATUS[0]} -eq 0
      - uses: actions/upload-artifact@v4
        with: { name: openlounge-pjtest-debug-apk, path: app/build/outputs/apk/pjtest/debug/*.apk, retention-days: 14 }
      - name: fail if any WebRTC / libpeerconnection symbol, import or dependency remains
        run: |
          set -euo pipefail
          ./gradlew --no-daemon -q :app:dependencies --configuration prodDebugRuntimeClasspath > deps.txt
          ! grep -iE "webrtc|peerconnection|livekit|mediasoup" deps.txt
          APK=$(find app/build/outputs/apk -name "*.apk" | head -1); mkdir x && cd x && unzip -q ../$APK
          ! ls lib/*/ | grep -iE "webrtc|peerconnection|jingle"
          ! (for f in lib/*/*.so; do $ANDROID_HOME/ndk/$NDK_VER/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm -D "$f" 2>/dev/null; done; strings classes*.dex) | grep -iE "org/webrtc|org\.webrtc|peerconnection"
          echo "APK clean: $(ls lib/*/)"
  emulator-matrix:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: free runner disk (emulator userdata needs ~7.4 GB)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/julia* || true; df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: donnydey22/openlounge, ref: pjsip-rebuild, path: ol }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 3.1.74, actions-cache-folder: "" }
      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VER" "cmake;3.22.1" >/dev/null
      - uses: actions/download-artifact@v4
        with: { name: pjproject-2.17-prefab-aar, path: app/libs }
      - name: build instrumented test APK (x86_64 engine)
        run: chmod +x gradlew && ./gradlew --no-daemon --no-build-cache :callengine:assembleDebugAndroidTest 2>&1 | tail -20; test ${PIPESTATUS[0]} -eq 0
      - name: CI stack deps (wasm browser peer, mediasoup worker)
        working-directory: ol
        run: wasm-call/build.sh && for d in media-sfu ws-media-relay tests/pjsip-matrix; do (cd $d && npm install --no-audit --no-fund); done
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: android<->browser audio + video cells (emulator, real engine + product MediaCodec codec, real mediasoup PlainTransport)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: adb install -r -t $(find callengine/build/outputs/apk/androidTest -name "*.apk" | head -1) && cd ol && PHONE=android MEDIA=audio,video CELL_SECONDS=30 BG_CELL=1 node tests/pjsip-matrix/run-phone.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: matrix-android, path: ol/tests/pjsip-matrix/results }
